name: Stateflow import corpus
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aitorarrietamarcos/StateflowRepairTool
          ref: 6c5ba07962d972d3eade2448e7212faf74e11a50
          path: _external/flowrepair
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: coco-team/regression-test
          ref: 70369bce666880805dcfdc325139ecdc8938a42d
          path: _external/cocosim
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: morganp/Stateflow_examples
          ref: 2b2031bd519566f10483ce211e5edb89d4f107a7
          path: _external/slnet_sample
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bzhan/mars
          ref: 5659710bc0fae06d05518bd7d80f11a3138cf679
          path: _external/mars
          persist-credentials: false
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Stateflow
          cache: true
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab'); extract_corpus
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python check_import.py artifacts/corpus-source.json
      - run: python research/add_provenance.py artifacts/corpus-source.json
      - run: python convert_corpus.py artifacts/corpus-source.json artifacts/converted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stateflow-import-source
          path: artifacts/
          if-no-files-found: error
